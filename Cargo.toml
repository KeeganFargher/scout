[workspace]
resolver = "3"
members = ["crates/*"]
# vendor/ripgrep is its own workspace; we consume its crates as path deps only.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
scout-core = { path = "crates/scout-core" }
scout-index-native = { path = "crates/scout-index-native" }
scout-index-sqlite = { path = "crates/scout-index-sqlite" }
scout-source-fs = { path = "crates/scout-source-fs" }
scout-store-fs = { path = "crates/scout-store-fs" }
scout-sync = { path = "crates/scout-sync" }

# Vendored ripgrep (git subtree). Patch here, not via crates.io.
grep-matcher = { path = "vendor/ripgrep/crates/matcher" }
grep-regex = { path = "vendor/ripgrep/crates/regex" }
grep-searcher = { path = "vendor/ripgrep/crates/searcher" }
grep-printer = { path = "vendor/ripgrep/crates/printer", default-features = false }
ignore = { path = "vendor/ripgrep/crates/ignore" }

regex-syntax = "0.8.11"
memchr = "2.8"
itoa = "1"
lz4 = "1.28.1"
memmap2 = "0.9"
# Safe Rust block encoder (no frames). Reads use the bounds-checked reference decoder.
lz4_flex = { version = "0.11.6", default-features = false, features = [
  "std",
  "safe-encode",
  "safe-decode",
  "checked-decode",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Casts between index widths (u32 doc ids, u64 offsets) are pervasive in the shard
# format; each one is bounded by a checked shard-size cap instead.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
# Every fallible fn returns the single `scout_core::Error`; per-fn "# Errors" sections
# would repeat its variants verbatim.
missing_errors_doc = "allow"
# Byte counts and timings are converted to f64 only for human-readable reporting.
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
