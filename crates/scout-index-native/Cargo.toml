[package]
name = "scout-index-native"
description = "scout's native shard format: mmapped corpus bin + trigram postings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lz4.workspace = true
memchr.workspace = true
memmap2.workspace = true
scout-core.workspace = true

[dev-dependencies]
# Only `codec-probe`'s baseline arm: the encoder the writer used before E38.
lz4_flex = { version = "0.11.6", default-features = false, features = ["std", "safe-encode"] }
grep-matcher.workspace = true
grep-regex.workspace = true
scout-store-fs.workspace = true
serde_json.workspace = true
tempfile = "3"
# Only `dict-probe`'s dictionary arms (E43): lz4 with a dictionary (lzzzz wraps the same C
# library as `lz4`), and zstd for its dictionary trainer.
lzzzz = "2.0.0"
zstd = "0.14.3"

[lints]
workspace = true
