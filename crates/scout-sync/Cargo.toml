[package]
name = "scout-sync"
description = "scout hosted ingestion: which remotes to mirror, and keeping working copies in step with them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
scout-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }

# Safe killpg for git's process group (src/tree.rs); keeps unsafe out of this crate.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
